name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build binaries
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"

          build() {
            local goos="${1}"
            local goarch="${2}"

            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build \
                -trimpath \
                -ldflags "-s -w -X main.version=${version}" \
                -o "dist/jj-git-prompt-${goos}-${goarch}" \
                ./cmd/jj-git-prompt
          }

          mkdir -p dist
          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "${GITHUB_REF_NAME}" \
            ./dist/* \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag
